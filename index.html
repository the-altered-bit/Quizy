<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quizy</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #12151a;
    --card: #1b1f27;
    --card-hover: #232833;
    --text: #eef1f6;
    --muted: #8b93a3;
    --accent: #5b8cff;
    --border: #2a2f3a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 24px 20px 40px;
  }

  h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 4px;
  }

  p.sub {
    color: var(--muted);
    margin: 0 0 24px;
    font-size: 14px;
  }

  .crumbs {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 16px;
    font-size: 14px;
    color: var(--muted);
    min-height: 20px;
  }

  .crumbs button {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 14px;
    padding: 0;
    cursor: pointer;
  }

  .list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    text-decoration: none;
    color: var(--text);
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .item:active,
  .item:hover {
    background: var(--card-hover);
    border-color: var(--accent);
  }

  .item-name {
    font-size: 16px;
    font-weight: 500;
  }

  .item-arrow {
    color: var(--muted);
    font-size: 18px;
  }

  .empty, .error {
    color: var(--muted);
    font-size: 14px;
    padding: 20px 0;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Quizzes</h1>
    <p class="sub">Pick a category</p>
    <div class="crumbs" id="crumbs"></div>
    <div class="list" id="list">
      <p class="empty">Loading…</p>
    </div>
  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }

    var root = [];
    var stack = []; // stack of {name, children} for breadcrumb navigation

    fetch('quizzes.json')
      .then(function (res) { return res.json(); })
      .then(function (data) {
        root = data;
        render(root, []);
      })
      .catch(function () {
        document.getElementById('list').innerHTML =
          '<p class="error">Could not load quiz list.</p>';
      });

    function render(items, trail) {
      var list = document.getElementById('list');
      var crumbs = document.getElementById('crumbs');
      list.innerHTML = '';
      crumbs.innerHTML = '';

      // breadcrumbs
      if (trail.length > 0) {
        var homeBtn = document.createElement('button');
        homeBtn.textContent = 'Quizzes';
        homeBtn.onclick = function () { render(root, []); };
        crumbs.appendChild(homeBtn);

        trail.forEach(function (node, i) {
          var sep = document.createElement('span');
          sep.textContent = '›';
          crumbs.appendChild(sep);

          var btn = document.createElement('button');
          btn.textContent = node.name;
          btn.onclick = function () {
            var newTrail = trail.slice(0, i + 1);
            render(node.children, newTrail);
          };
          crumbs.appendChild(btn);
        });
      }

      if (!items || items.length === 0) {
        list.innerHTML = '<p class="empty">Nothing here yet.</p>';
        return;
      }

      items.forEach(function (node) {
        var el;
        if (node.children) {
          el = document.createElement('div');
          el.className = 'item';
          el.onclick = function () {
            render(node.children, trail.concat([node]));
          };
        } else {
          el = document.createElement('a');
          el.className = 'item';
          el.href = encodeURI(node.path);
        }

        var name = document.createElement('span');
        name.className = 'item-name';
        name.textContent = node.name;

        var arrow = document.createElement('span');
        arrow.className = 'item-arrow';
        arrow.textContent = '\u203A';

        el.appendChild(name);
        el.appendChild(arrow);
        list.appendChild(el);
      });
    }
  </script>
</body>
</html>
