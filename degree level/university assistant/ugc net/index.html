<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>UGC NET Paper 1 - Higher Education Quiz</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--card2:#1c2230;--acc:#7c5cff;--acc2:#22d3ee;--good:#22c55e;--bad:#ef4444;--txt:#e6e9ef;--sub:#9aa4b2;--border:#2a3140;}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;overflow-y:auto;-webkit-overflow-scrolling:touch;}
body{background:radial-gradient(1200px 800px at 80% -10%,#1a1030 0%,var(--bg) 60%);color:var(--txt);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);min-height:100%;}
#app{max-width:680px;margin:0 auto;padding:20px 16px 60px;}
h1{font-size:1.3rem;text-align:center;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent;margin:10px 0 4px;}
.sub{text-align:center;color:var(--sub);font-size:.85rem;margin-bottom:18px;}
#start-screen{text-align:center;padding:40px 10px;}
.big-btn{background:linear-gradient(90deg,var(--acc),var(--acc2));border:none;color:#0d1117;font-weight:700;font-size:1.05rem;padding:14px 30px;border-radius:14px;cursor:pointer;box-shadow:0 8px 24px rgba(124,92,255,.35);transition:transform .15s;}

#progress-wrap{background:var(--card);border-radius:10px;height:10px;overflow:hidden;margin-bottom:16px;border:1px solid var(--border);}
#progress-bar{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));width:0%;transition:width .3s;}
#meta{display:flex;justify-content:space-between;font-size:.8rem;color:var(--sub);margin-bottom:10px;}
#qcard{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:22px 18px;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:pop .35s ease;}
@keyframes pop{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
#qtext{font-size:1.05rem;line-height:1.5;margin-bottom:18px;white-space:pre-line;overflow-wrap:anywhere;word-break:break-word;}
.opt{display:block;width:100%;text-align:left;background:var(--card2);border:1px solid var(--border);color:var(--txt);padding:13px 16px;margin-bottom:10px;border-radius:12px;font-size:.95rem;cursor:pointer;transition:all .15s;overflow-wrap:anywhere;word-break:break-word;line-height:1.4;}
.opt:hover{border-color:var(--acc);background:#232a3c;}
.opt.disabled{pointer-events:none;opacity:.85;}
.opt.correct{background:rgba(34,197,94,.18);border-color:var(--good);}
.opt.incorrect{background:rgba(239,68,68,.18);border-color:var(--bad);animation:shake .4s;}

#nextbtn{margin-top:8px;width:100%;padding:13px;border:none;border-radius:12px;background:linear-gradient(90deg,var(--acc),var(--acc2));color:#0d1117;font-weight:700;cursor:pointer;display:none;}
.navrow{display:flex;gap:8px;margin-top:4px;}
.navbtn{flex:1;padding:11px 6px;border-radius:10px;border:1px solid var(--border);background:var(--card2);color:var(--sub);font-size:.82rem;font-weight:600;cursor:pointer;transition:all .15s;}
.navbtn:hover{border-color:var(--acc);color:var(--txt);}
.navbtn:disabled{opacity:.35;cursor:not-allowed;}
.navbtn:disabled:hover{border-color:var(--border);color:var(--sub);}

#toast.show{bottom:24px;}
#toast.good{border-color:var(--good);}
#toast.bad{border-color:var(--bad);}
.toast-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
#toast.good .toast-icon{background:rgba(34,197,94,.18);color:var(--good);}
#toast.bad .toast-icon{background:rgba(239,68,68,.18);color:var(--bad);}
.toast-icon svg{width:20px;height:20px;overflow:visible;}
.toast-icon path{stroke-dasharray:26;stroke-dashoffset:26;animation:draw .45s ease forwards .1s;}
@keyframes draw{to{stroke-dashoffset:0;}}
.toast-text{font-size:.92rem;font-weight:700;}
.toast-text small{display:block;font-weight:400;color:var(--sub);font-size:.78rem;margin-top:2px;max-width:220px;}
.opt.correct{position:relative;}
.opt.correct::after{content:"";position:absolute;inset:0;border-radius:12px;box-shadow:0 0 0 0 rgba(34,197,94,.5);animation:ring .5s ease-out;}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(34,197,94,.5);}100%{box-shadow:0 0 0 10px rgba(34,197,94,0);}}
#result{display:none;text-align:center;}
.score-circle{width:160px;height:160px;border-radius:50%;margin:20px auto;display:flex;align-items:center;justify-content:center;flex-direction:column;background:conic-gradient(var(--acc) calc(var(--pct,0)*1%),var(--card2) 0);position:relative;}
.score-circle::before{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--bg);}
.score-inner{position:relative;z-index:1;}
.score-inner b{font-size:2rem;}
#reviewlist{text-align:left;margin-top:20px;}
.rev{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:.88rem;overflow-wrap:anywhere;word-break:break-word;}
.rev .tag{font-size:.75rem;padding:2px 8px;border-radius:6px;margin-left:6px;}
.tag.ok{background:rgba(34,197,94,.2);color:var(--good);}
.tag.no{background:rgba(239,68,68,.2);color:var(--bad);}
#restartbtn{margin-top:20px;}
footer{text-align:center;color:var(--sub);font-size:.75rem;margin-top:30px;}
</style>
</head>

let idx=0,responses=new Array(Q.length).fill(null),advanceGen=0;
function startQuiz(){advanceGen++;document.getElementById('start-screen').style.display='none';document.getElementById('quiz-screen').style.display='block';loadQ();}
function scoreSoFar(){return responses.filter(r=>r&&r.isCorrect).length;}
function answeredCount(){return responses.filter(r=>r).length;}
function loadQ(){
 const item=Q[idx];
 document.getElementById('qnum').textContent='Question '+(idx+1)+' / '+Q.length;
 document.getElementById('scorelive').textContent='Score: '+scoreSoFar()+'/'+answeredCount();
 document.getElementById('progress-bar').style.width=(answeredCount()/Q.length*100)+'%';
 document.getElementById('qtext').textContent=item[0];
 const opts=document.getElementById('opts');opts.innerHTML='';
 const existing=responses[idx];
 const nb=document.getElementById('nextbtn');
 nb.textContent=(idx===Q.length-1)?'See Results →':'Next →';
 item[1].forEach((o,i)=>{
   const b=document.createElement('button');b.className='opt';b.textContent=o;
   if(existing&&!existing.skipped){
     if(i===item[2])b.classList.add('correct');
     else if(i===existing.picked)b.classList.add('incorrect');
   }else{
     b.onclick=()=>selectAns(i,b);
   }
   opts.appendChild(b);
 });
 nb.style.display=(existing&&!existing.skipped)?'block':'none';
 document.getElementById('backbtn').disabled=(idx===0);
}
function selectAns(i,btn){
 if(responses[idx]&&!responses[idx].skipped)return;
 const item=Q[idx];
 const correct=item[2];
 const allBtns=document.querySelectorAll('.opt');
 allBtns.forEach(b=>b.onclick=null);
 const isCorrect=i===correct;
 if(isCorrect){btn.classList.add('correct');showToast(true);}
 else{btn.classList.add('incorrect');allBtns[correct].classList.add('correct');showToast(false,item[1][correct]);}
 responses[idx]={picked:i,isCorrect,skipped:false};
 document.getElementById('scorelive').textContent='Score: '+scoreSoFar()+'/'+answeredCount();
 document.getElementById('progress-bar').style.width=(answeredCount()/Q.length*100)+'%';
 document.getElementById('nextbtn').style.display='block';
 const myGen=++advanceGen;
 setTimeout(()=>{if(myGen===advanceGen)goNext();},isCorrect?1500:2500);
}
const CHECK_SVG='<svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const CROSS_SVG='<svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>';
let toastTimer=null;
function showToast(good,correctText){
 const t=document.getElementById('toast');
 clearTimeout(toastTimer);
 t.className='';
 t.classList.add(good?'good':'bad');
 document.getElementById('toastIcon').innerHTML=good?CHECK_SVG:CROSS_SVG;
 document.getElementById('toastText').innerHTML=good?'Correct!':'Incorrect<small>Correct: '+correctText+'</small>';
 requestAnimationFrame(()=>t.classList.add('show'));
 toastTimer=setTimeout(()=>t.classList.remove('show'),good?1300:2200);
}
function goNext(){
 advanceGen++;
 clearTimeout(toastTimer);
 document.getElementById('toast').classList.remove('show');
 idx++;
 if(idx>=Q.length){showResult();}else{loadQ();}
}
function goBack(){
 if(idx===0)return;
 advanceGen++;
 clearTimeout(toastTimer);
 document.getElementById('toast').classList.remove('show');
 idx--;
 loadQ();
}
function skipCurrent(){
 advanceGen++;
 if(!responses[idx])responses[idx]={picked:null,isCorrect:false,skipped:true};
 clearTimeout(toastTimer);
 document.getElementById('toast').classList.remove('show');
 idx++;
 if(idx>=Q.length){showResult();}else{loadQ();}
}
function skipAll(){
 advanceGen++;
 for(let i=idx;i<Q.length;i++){if(!responses[i])responses[i]={picked:null,isCorrect:false,skipped:true};}
 clearTimeout(toastTimer);
 document.getElementById('toast').classList.remove('show');
 showResult();
}
function showResult(){
 document.getElementById('quiz-screen').style.display='none';
 document.getElementById('result').style.display='block';
 const score=scoreSoFar();
 const pct=Math.round(score/Q.length*100);
 document.getElementById('circle').style.setProperty('--pct',pct);
 document.getElementById('scorenum').textContent=score+'/'+Q.length;
 let msg=pct>=80?'Excellent! You know this unit well.':pct>=60?'Good effort — revise weak areas.':'Keep practicing, review the topics below.';
 document.getElementById('resulttext').textContent=pct+'% — '+msg;
 const rl=document.getElementById('reviewlist');
 rl.innerHTML='';
 const h=document.createElement('h3');h.textContent='Review';rl.appendChild(h);
 Q.forEach((item,i)=>{
   const r=responses[i];
   const d=document.createElement('div');d.className='rev';
   const qline=document.createElement('div');
   const b=document.createElement('b');b.textContent='Q'+(i+1)+'. ';
   qline.appendChild(b);qline.appendChild(document.createTextNode(item[0]));
   d.appendChild(qline);
   const ansline=document.createElement('div');ansline.style.marginTop='6px';
   if(!r||r.skipped){
     ansline.appendChild(document.createTextNode('Skipped '));
     const tag=document.createElement('span');tag.className='tag no';tag.textContent='Skipped';
     ansline.appendChild(tag);
   }else{
     ansline.appendChild(document.createTextNode('Your answer: '+item[1][r.picked]+' '));
     const tag=document.createElement('span');tag.className='tag '+(r.isCorrect?'ok':'no');tag.textContent=r.isCorrect?'Correct':'Wrong';
     ansline.appendChild(tag);
   }
   d.appendChild(ansline);
   if(!r||!r.isCorrect){
     const cline=document.createElement('div');cline.style.color='var(--good)';cline.style.marginTop='4px';
     cline.textContent='Correct: '+item[1][item[2]];
     d.appendChild(cline);
   }
   rl.appendChild(d);
 });
}
</script>
